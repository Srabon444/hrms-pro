name: hrms

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://hrms_app:${HRMS_APP_DB_PASSWORD:-hrms_app_dev}@postgres:5432/hrms
  AUTH_DATABASE_URL: postgres://hrms_auth:${HRMS_AUTH_DB_PASSWORD:-hrms_auth_dev}@postgres:5432/hrms
  OWNER_DATABASE_URL: postgres://hrms_owner:${POSTGRES_PASSWORD:-hrms_owner_dev}@postgres:5432/hrms
  HRMS_APP_DB_PASSWORD: ${HRMS_APP_DB_PASSWORD:-hrms_app_dev}
  HRMS_AUTH_DB_PASSWORD: ${HRMS_AUTH_DB_PASSWORD:-hrms_auth_dev}
  REDIS_URL: redis://redis:6379
  REDIS_PREFIX: ${REDIS_PREFIX:-hrms}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hrms_minio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hrms_minio_dev_secret}
  S3_BUCKET: ${S3_BUCKET:-hrms}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:-HRMS <no-reply@hrms.local>}
  APP_URL: ${APP_URL:-http://localhost:3000}
  ORIGIN: ${APP_URL:-http://localhost:3000}
  APP_ENC_KEYS: ${APP_ENC_KEYS:-dev1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}
  BODY_SIZE_LIMIT: 12M
  TEST_MODE: ${TEST_MODE:-0}

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: hrms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_owner_dev}
      POSTGRES_DB: hrms
    command: ['postgres', '-c', 'log_min_duration_statement=500', '-c', 'max_connections=200']
    ports: ['${PG_PORT:-55432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms_owner -d hrms']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['${REDIS_PORT:-56379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrms_minio_dev_secret}
    ports: ['${MINIO_PORT:-59000}:9000', '${MINIO_CONSOLE_PORT:-59001}:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ['${MAILPIT_UI_PORT:-58025}:8025', '${MAILPIT_SMTP_PORT:-51025}:1025']
    environment:
      MP_MAX_MESSAGES: 5000

  migrate:
    profiles: [app]
    build: .
    command: ['npx', 'tsx', 'src/cli.ts', 'migrate']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  app:
    profiles: [app]
    build: .
    command: ['node', 'build']
    environment: *app-env
    ports: ['${APP_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    profiles: [app]
    build: .
    command: ['node', '--import', 'tsx', 'src/worker.ts']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
